# Copy to spreadscout.yaml and edit. Every value here has a default in config.py;
# this file exists to make the assumptions visible rather than buried.

symbol: SPX
dte: 0                  # 0 = today's expiry (SPXW, PM-settled)
environment: production # this tool never places orders in either environment
risk_free_rate: 0.04
dividend_yield: 0.013   # SPX index dividend yield; feeds the forward, not the payoff
# account_id: 6YA00000  # omit to use the first account on the profile

filters:
  min_open_interest: 100
  min_volume: 10
  max_relative_spread: 0.20   # reject legs quoted wider than 20% of mid
  min_short_delta: 0.05
  max_short_delta: 0.25
  # Credit must be at least this fraction of the width. The classic "collect a
  # third of the width" guidance is a 30-45 DTE rule and does not survive
  # contact with a 0DTE chain -- measured live, SPX 0DTE spreads in this delta
  # band price between 0.10 and 0.18 of width. Raising this toward 0.33 does not
  # find you better trades, it just leaves you with the few strikes closest to
  # the money, which are the highest-gamma ones on the board.
  min_credit_ratio: 0.10
  min_credit: 0.30            # index points
  widths: [5.0, 10.0, 25.0]
  max_candidates: 15

costs:
  commission_per_contract: 0.35   # Tradier options commission
  exchange_fee_per_contract: 0.49 # SPX index option exchange/regulatory fees
  assume_closing_trade: true      # doubles per-leg costs; set false if you always
                                  # let 0DTE cash-settle instead of closing early
  fill_fraction: 0.40             # 0 = mid fill (fantasy), 1 = pay the full spread

risk:
  max_risk_pct_per_trade: 0.02
  max_total_risk_pct: 0.06
  max_contracts: 10
  daily_loss_limit_pct: 0.03
  min_equity: 2000.0
  require_positive_ev: true       # refuse to size a trade that loses money on average

beliefs:
  # THE ONLY SOURCE OF EDGE IN THIS STRATEGY.
  #
  # source: measured  -- derive the vol assumption from the trailing variance
  #                      risk premium: what the index has actually been
  #                      realizing versus what the chain is charging. This
  #                      replaces a guess with a measurement. It is still a
  #                      forecast, because it assumes the trailing window
  #                      describes tomorrow, and that assumption fails hardest
  #                      on exactly the day it costs the most.
  # source: manual    -- use vol_multiplier verbatim. At 1.00 every candidate
  #                      shows negative EV after costs and the tool recommends
  #                      nothing, which is the correct answer to "is there free
  #                      money here".
  source: measured
  vol_multiplier: 1.00   # used when source is manual, or as the fallback
  haircut: 0.05          # added to the measured multiplier, making it less
                         # favourable. Trailing realized vol systematically
                         # understates the day it stops being trailing.
  # drift: null          # continuously-compounded expected index return;
                         # defaults to risk_free_rate - dividend_yield

gates:
  # Conditions that must ALL hold before an entry is worth alerting on. Every
  # gate is a reason not to trade; the default posture is no.
  #
  # Measured on 67 real SPX sessions: realized vol ran 13.7% close-to-close
  # against 10.1% open-to-close, because about a third of the variance arrives
  # overnight -- risk a 0DTE seller never carries. Against a VIX-consistent
  # 15.2% implied that is +10.8% premium on the conservative reading and +51%
  # on the horizon-matched one. Both are always reported; the gate names which
  # it used. Do not raise the floor and lower conservative_vrp at the same time
  # without understanding you have changed two things at once.
  min_variance_risk_premium: 0.15
  conservative_vrp: true

  min_vix_percentile: 0.20      # do not sell vol that is already on the floor
  max_todays_move_sigma: 1.25   # do not sell into a move already underway

  entry_start_hour: 10          # ET. Before this the quotes are wide and the
  entry_start_minute: 0         # opening direction is noise.
  entry_end_hour: 14            # After this there is too little time left to
  entry_end_minute: 0           # manage a position that turns against you.

  blackout_dates: []            # manual one-offs, on top of the event calendar below

  # --- scheduled economic events -----------------------------------------
  # FOMC at 14:00 ET is the one that matters. It lands mid-session, inside the
  # entry window, while your position is open. The 08:30 releases (CPI, NFP)
  # have already printed by the time entries open at 10:00 -- with the default
  # -120/+90 window an 08:30 event blocks 06:30-10:00, which is clear before the
  # entry window even starts. They matter mainly as a signal that the session
  # will realize more volatility than the trailing window implies.
  block_on_events: true
  block_impact_at_or_above: high    # low | medium | high
  event_minutes_before: 120
  event_minutes_after: 90

  # FAIL CLOSED. If no calendar source can confirm today is clear, block. A
  # data source returning nothing is indistinguishable from a genuinely empty
  # day, and guessing wrong here means holding a 0DTE condor through a rate
  # decision. Set false only if you are checking the calendar yourself.
  require_event_calendar: true

  use_derived_events: true          # Employment Situation, first Friday 08:30 ET
  event_calendar_file: null         # your own YAML, checked before the bundled seed
  event_cache_minutes: 360.0

  # Sources, in priority order:
  #   derived       first-Friday NFP. A calendar rule, so it never goes stale.
  #   user-file     event_calendar_file, if set. Put your CPI/PPI/PCE dates here.
  #   bundled-seed  spreadscout/data/econ_events.yaml -- FOMC dates, which were
  #                 written from memory and NOT fetched from a live source.
  #                 VERIFY THEM against federalreserve.gov before relying on
  #                 this. The file carries a verified_through date and reports
  #                 itself stale past it, which blocks entry rather than
  #                 pretending next year has no meetings.
  #   fmp           FMP's economic calendar, if FMP_API_KEY is set. Requires
  #                 their Starter tier or above, and the adapter is UNVERIFIED
  #                 against the live endpoint. Supplementary: if it fails you
  #                 get a warning, not a halt.
  #
  # Run `spreadscout calendar` to see what is loaded and whether anything
  # is stale.

monitor:
  # Thresholds for positions you ALREADY HOLD. These matter more than the entry
  # gates: a missed entry costs nothing, a breached 0DTE short strike costs the
  # width of the spread.
  short_delta_alert: 0.33       # WARN
  short_delta_critical: 0.45    # CRITICAL
  strike_proximity_points: 15.0 # alert when spot comes this close to a short
  loss_multiple_alert: 2.0      # alert at 2x the credit taken in
  daily_loss_warn_fraction: 0.70 # warn at 70% of the daily limit, not only at 100%

alerts:
  terminal_bell: true
  log_file: alerts.jsonl        # JSON lines, so history survives the process
  webhook_url: null             # Slack or Discord incoming webhook URL
  webhook_min_severity: WARN    # INFO | WARN | CRITICAL
  cooldown_minutes: 15.0        # repeats inside this window are suppressed;
                                # CRITICAL alerts use a quarter of it
  poll_seconds: 60
  heartbeat_minutes: 60.0       # periodic "still watching, here is why not" note
