[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tqsq"
version = "0.1.0"
description = "TQQQ/SQQQ exhaustion-mark strategy: a Python port of the 0DTE regime score, a three-tranche backtest, and a Robinhood decision bridge"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
]

[project.optional-dependencies]
databento = ["databento>=0.83"]
dev = ["pytest>=7.0"]

[project.scripts]
tqsq = "tqsq.cli:main"

[tool.setuptools.packages.find]
include = ["tqsq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
