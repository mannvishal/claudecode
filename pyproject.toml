[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadscout"
version = "0.1.0"
description = "Recommendation-only screener for SPX credit spreads and iron condors"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# `databento` is deliberately an extra, not a hard dependency: signals, fills,
# reporting and every test run without it. Install it only to pull live data.
databento = ["databento>=0.34"]

[project.scripts]
spreadscout = "spreadscout.cli:main"
spreadscout-backtest = "backtest.cli:main"

[tool.setuptools.packages.find]
include = ["spreadscout*", "backtest*"]

[tool.setuptools.package-data]
spreadscout = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
