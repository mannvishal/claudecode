[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadscout"
version = "0.1.0"
description = "Recommendation-only screener for SPX credit spreads and iron condors"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spreadscout = "spreadscout.cli:main"

[tool.setuptools.packages.find]
include = ["spreadscout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
